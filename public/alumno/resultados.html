<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados · Plataforma de exámenes</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/png" href="/img/icono.png">
  <link rel="apple-touch-icon" href="/img/icono.png">
</head>
<body data-rol="alumno">
  <main id="contenido" class="container contenedor-angosto py-4 py-md-5">
    <p class="text-suave" id="cargando">Cargando…</p>
    <div class="alert alert-danger d-none" role="alert" id="error"></div>
    <a class="btn btn-primary d-none" href="/alumno/panel.html" id="volver-error">Volver a mis exámenes</a>

    <section class="card mb-4 d-none" aria-labelledby="t-resultado" id="resumen">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <h1 class="titulo-pantalla" id="t-resultado" tabindex="-1"></h1>
          <p class="text-suave mb-0" id="meta"></p>
        </div>
        <div class="text-sm-end">
          <div class="small text-suave">Calificación</div>
          <div class="display-6 fw-bold text-primary"><span id="calificacion"></span> <span class="fs-5 text-suave">/ 10</span></div>
        </div>
      </div>
    </section>

    <section class="card d-none" aria-labelledby="t-detalle" id="detalle">
      <div class="card-body">
        <h2 class="titulo-seccion" id="t-detalle">Respuestas</h2>
        <ol class="list-unstyled d-flex flex-column gap-3 mb-0" id="preguntas"></ol>
      </div>
    </section>
    <p class="text-suave d-none" id="sin-detalle">Tu docente no habilitó la consulta de respuestas para este examen. Si tienes dudas sobre tu calificación, coméntalas directamente con tu docente.</p>
    <a class="btn btn-outline-primary d-none mt-2" href="/alumno/panel.html" id="volver">Volver a mis exámenes</a>
  </main>
  <script src="/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/resultados.js"></script>
</body>
</html>
