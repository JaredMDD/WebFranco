<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta · Plataforma de exámenes</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/png" href="/img/icono.png">
  <link rel="apple-touch-icon" href="/img/icono.png">
</head>
<body data-rol="docente" data-pagina="cuenta">
  <main id="contenido" class="container contenedor-medio py-4 py-md-5">
    <h1 class="titulo-pantalla">Mi cuenta</h1>
    <p class="text-suave mb-4">Usuario: <strong id="cuenta-usuario">…</strong></p>
    <div class="row g-4">
      <div class="col-md-6">
        <form class="card h-100" id="form-contrasena">
          <div class="card-body">
            <h2 class="titulo-seccion">Cambiar contraseña</h2>
            <div class="alert alert-success d-none" role="status" id="aviso-contrasena"></div>
            <div class="alert alert-danger d-none" role="alert" id="error-contrasena"></div>
            <!-- Para que el gestor de contraseñas sepa de qué cuenta es -->
            <input type="text" name="usuario" autocomplete="username" hidden>
            <div class="mb-3">
              <label class="form-label" for="pw-actual">Contraseña actual</label>
              <input class="form-control" id="pw-actual" name="actual" type="password" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="pw-nueva">Contraseña nueva</label>
              <input class="form-control" id="pw-nueva" name="nueva" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-nueva-ayuda">
              <div class="form-text" id="pw-nueva-ayuda">Mínimo 8 caracteres, con letras y números. Se cerrará tu sesión en otros equipos.</div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="pw-confirmar">Confirmar contraseña nueva</label>
              <input class="form-control" id="pw-confirmar" name="confirmar" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn btn-primary" type="submit">Guardar contraseña</button>
          </div>
        </form>
      </div>
      <div class="col-md-6">
        <form class="card h-100" id="form-correo">
          <div class="card-body">
            <h2 class="titulo-seccion">Correo de recuperación</h2>
            <p class="small text-suave">Aquí te llega el enlace si usas "¿Olvidaste tu contraseña?".</p>
            <div class="alert alert-warning" role="status" id="falta-correo" hidden>Aún no tienes correo: regístralo para poder recuperar tu contraseña.</div>
            <div class="alert alert-success d-none" role="status" id="aviso-correo"></div>
            <div class="alert alert-danger d-none" role="alert" id="error-correo"></div>
            <div class="mb-3">
              <label class="form-label" for="co-correo">Correo</label>
              <input class="form-control" id="co-correo" name="correo" type="email" maxlength="254" autocomplete="email" required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="co-actual">Contraseña actual</label>
              <input class="form-control" id="co-actual" name="actual" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-outline-primary" type="submit">Guardar correo</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cuenta.js"></script>
</body>
</html>
