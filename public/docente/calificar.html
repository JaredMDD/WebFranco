<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calificar · Plataforma de exámenes</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:,">
</head>
<body data-rol="docente" data-pagina="panel">
  <main id="contenido" class="container contenedor-ancho py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>
        <h1 class="titulo-pantalla mb-0">Calificar</h1>
        <p class="text-suave mb-0" id="titulo-examen"></p>
      </div>
      <button class="btn btn-primary" type="button" id="publicar" disabled>Publicar resultados</button>
    </div>
    <p class="small text-suave" id="nota-publicar"></p>
    <div class="alert alert-success d-none" role="status" id="aviso"></div>
    <div class="alert alert-danger d-none" role="alert" id="error"></div>

    <div class="row g-4">
      <div class="col-lg-4">
        <section class="card" aria-labelledby="t-alumnos">
          <div class="card-body">
            <h2 class="titulo-seccion" id="t-alumnos">Alumnos</h2>
            <div class="list-group list-group-flush" id="lista-alumnos"><p class="text-suave mb-0">Cargando…</p></div>
          </div>
        </section>
      </div>

      <div class="col-lg-8">
        <section class="card" aria-labelledby="t-respuestas">
          <div class="card-body">
            <h2 class="titulo-seccion" id="t-respuestas" tabindex="-1">Respuestas</h2>
            <p class="text-suave mb-0" id="sin-elegir">Elige un alumno con examen enviado para calificar sus preguntas abiertas.</p>
            <form class="d-none" id="form-calificar" novalidate>
              <p class="small text-suave" id="resumen-cerradas"></p>
              <div id="abiertas"></div>
              <div class="alert alert-danger d-none" role="alert" id="error-calificar"></div>
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 bloque-final">
                <span>Calificación: <strong id="calificacion">—</strong> <span class="text-suave">/ 10</span></span>
                <button class="btn btn-primary" type="submit">Guardar calificación</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <template id="tpl-abierta">
    <div class="bloque">
      <p class="fw-semibold mb-2"><span class="enunciado" style="white-space: pre-line"></span> <span class="text-suave fw-normal valor"></span></p>
      <p class="bg-body-tertiary rounded-3 p-3 mb-3 respuesta" style="white-space: pre-line"></p>
      <div class="row g-3">
        <div class="col-sm-3">
          <label class="form-label etiqueta-puntos">Puntos</label>
          <input class="form-control puntos" type="number" min="0" step="0.25" inputmode="decimal">
        </div>
        <div class="col-sm-9">
          <label class="form-label etiqueta-comentario">Comentario (opcional)</label>
          <input class="form-control comentario" type="text" maxlength="1000">
        </div>
      </div>
    </div>
  </template>

  <script src="/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/calificar.js"></script>
</body>
</html>
